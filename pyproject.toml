[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvprof"
version = "1.0.0"
description = "Streaming CSV profiler CLI: type inference, column statistics, missing values, duplicates and outlier detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Subhan Malik" }]

[project.scripts]
csvprof = "csvprof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
